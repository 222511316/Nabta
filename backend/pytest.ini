[pytest]
testpaths = tests
pythonpath = .
# test_real_ai.py calls the paid OpenAI API; the assessed release runs with AI off (supervisor review
# OBS-06), so it is left out of the default run. Run it on purpose with:  pytest -m real_ai
addopts = -ra --strict-markers --strict-config -m "not real_ai"
markers =
    settings(**overrides): override application settings for one test
    real_ai: calls the real OpenAI API (needs NABTA_OPENAI_API_KEY); not part of the default run
# Every warning fails the run, except one: Starlette 1.7 asks for the `httpx2`
# package in its TestClient, while this project pins httpx==0.28.1.
filterwarnings =
    error
    ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning
