[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers --strict-config
markers =
    settings(**overrides): override application settings for one test
# Every warning fails the run, except one: Starlette 1.7 asks for the `httpx2`
# package in its TestClient, while this project pins httpx==0.28.1.
filterwarnings =
    error
    ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning
